<svg xmlns="http://www.w3.org/2000/svg" width="820" height="576" viewBox="0 0 820 576" role="img" aria-labelledby="t d">
<title id="t">Throughput relative to RocksDB</title>
<desc id="d">Random writes: StrataKV 381 K per second, RocksDB 386 K per second, SQLite 20 K per second; Random overwrites: StrataKV 381 K per second, RocksDB 382 K per second, SQLite 31 K per second; Bulk load (batches of 1,000): StrataKV 752 K per second, RocksDB 1.91 M per second, SQLite 480 K per second; Durable writes (fsync each): StrataKV 6 K per second, RocksDB 7 K per second, SQLite 5 K per second; Random reads: StrataKV 238 K per second, RocksDB 153 K per second, SQLite 199 K per second; Reads of missing keys: StrataKV 1.02 M per second, RocksDB 578 K per second, SQLite 201 K per second; Scans of 100 keys: StrataKV 26 K per second, RocksDB 23 K per second, SQLite 45 K per second; Full scan: StrataKV 5.50 M per second, RocksDB 4.56 M per second, SQLite 10.37 M per second</desc>
<style>
  svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
        --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --before: #c3c2b7; }
  @media (prefers-color-scheme: dark) {
    svg { --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
          --s1: #3987e5; --s2: #d95926; --s3: #199e70; --before: #52514e; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 12px; }
  .row { fill: var(--ink); font-size: 12px; }
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .val { fill: var(--ink2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .note { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .bg { fill: var(--surface); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); } .before { fill: var(--before); }
</style>
