<text x="40" y="80">Before</text>
<rect class="s1" x="104" y="71" width="10" height="10" rx="2"/>
<text x="120" y="80">After</text>
<text class="row" x="24.0" y="98">Scans of 100 keys per second</text>
<line class="axis" x1="24.0" y1="108" x2="24.0" y2="134"/>
<path class="before" d="M24.0,110.0 H24.0 Q26.7,110.0 26.7,112.7 V129.3 Q26.7,132.0 24.0,132.0 H24.0 Z"/>
<text class="val" x="32.7" y="125.0">410</text>
<line class="axis" x1="24.0" y1="134" x2="24.0" y2="160"/>
<path class="s1" d="M24.0,136.0 H191.3 Q195.3,136.0 195.3,140.0 V154.0 Q195.3,158.0 191.3,158.0 H24.0 Z"/>
<text class="val" x="201.3" y="151.0">26,037</text>
<text class="note" x="24.0" y="184">63× faster</text>
<text class="tick" x="24.0" y="202">higher is better</text>
<text class="row" x="289.3" y="98">Slowest 1% of bulk-load batches, ms</text>
<line class="axis" x1="289.3" y1="108" x2="289.3" y2="134"/>
<path class="before" d="M289.3,110.0 H456.7 Q460.7,110.0 460.7,114.0 V128.0 Q460.7,132.0 456.7,132.0 H289.3 Z"/>
<text class="val" x="466.7" y="125.0">26 ms</text>
<line class="axis" x1="289.3" y1="134" x2="289.3" y2="160"/>
<path class="s1" d="M289.3,136.0 H324.6 Q328.6,136.0 328.6,140.0 V154.0 Q328.6,158.0 324.6,158.0 H289.3 Z"/>
<text class="val" x="334.6" y="151.0">6 ms</text>
<text class="note" x="289.3" y="184">4× lower</text>
<text class="tick" x="289.3" y="202">lower is better</text>
<text class="row" x="554.7" y="98">Reopens wrongly refused, of 20,000</text>
