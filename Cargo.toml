[package]
name = "stratakv"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

# The benchmark lives in its own crate so that StrataKV itself never depends on RocksDB or SQLite.
[workspace]
members = ["bench"]
