[package]
name = "stratakv"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "A crash-safe key-value storage engine: a log-structured merge tree with snapshots, range scans and crash tests at every step"
repository = "https://github.com/Shibin506/StrataKV"
readme = "README.md"
keywords = ["database", "lsm-tree", "key-value", "storage-engine", "crash-safe"]
categories = ["database-implementations"]

[dependencies]
crc32fast = "1.5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

# The benchmark lives in its own crate so that StrataKV itself never depends on RocksDB or SQLite.
[workspace]
members = ["bench"]
